[project]
name = "richforms"
version = "0.2.1"
description = "Rich terminal forms generated from Pydantic models."
readme = "README.md"
authors = [
    { name = "Shiny Brar", email = "shiny.brar@nrc-cnrc.gc.ca" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "rich>=14.0",
    "typer>=0.24.0",
]

[project.scripts]
richforms = "richforms.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "ty>=0.0.17",
    "zensical>=0.0.23",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
