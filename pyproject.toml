[project]
name = "richforms"
version = "0.5.1"
description = "Turn Pydantic models into interactive Rich terminal forms — with built-in Click & Typer integrations."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shiny Brar", email = "shiny.brar@nrc-cnrc.gc.ca" },
]
maintainers = [
    { name = "Shiny Brar", email = "shiny.brar@nrc-cnrc.gc.ca" },
]
requires-python = ">=3.10"
keywords = [
    "cli",
    "click",
    "forms",
    "interactive",
    "pydantic",
    "prompt",
    "rich",
    "terminal",
    "tui",
    "typer",
    "validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=14.0",
    "typer>=0.20",
]

[project.urls]
Homepage = "https://github.com/shinybrar/richforms"
Documentation = "https://shinybrar.github.io/richforms"
Repository = "https://github.com/shinybrar/richforms"
Issues = "https://github.com/shinybrar/richforms/issues"
Changelog = "https://github.com/shinybrar/richforms/releases"

[project.scripts]
richforms = "richforms.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "ty>=0.0.17",
    "zensical>=0.0.23",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
