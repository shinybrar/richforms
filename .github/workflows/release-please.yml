name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # Some repositories require a PAT for creating GitHub releases.
          # Fallback to github.token when RELEASE_PLEASE_TOKEN is not configured.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Dispatch PYPI Release
        if: ${{ steps.release.outputs.release_created }}
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          repository: shinybrar/richforms
          event-type: pypi-release
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          client-payload: |-
            {
              "releases_created": "${{ steps.release.outputs.releases_created }}",
              "tag_name": "${{ steps.release.outputs.tag_name }}",
              "sha": "${{ steps.release.outputs.sha }}"
            }
